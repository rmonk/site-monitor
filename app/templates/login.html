{% extends "base.html" %}

{% block title %}Login - Site Monitor{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill text-primary display-4"></i>
                    <h4 class="fw-bold mt-2">Admin Login</h4>
                    <p class="text-body-secondary small">Sign in to manage site monitoring</p>
                </div>

                <div id="passkeyLoginAlert" class="alert alert-danger d-none mb-3" role="alert"></div>

                <div class="mb-4">
                    <button type="button" class="btn btn-outline-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 shadow-sm" id="passkeyLoginBtn" onclick="loginWithPasskey()">
                        <i class="bi bi-fingerprint fs-5"></i>
                        <span>Sign in with Passkey</span>
                    </button>
                </div>

                <div class="position-relative text-center my-4">
                    <hr class="text-muted">
                    <span class="position-absolute top-50 start-50 translate-middle px-3 bg-body text-body-secondary small fw-medium">
                        or sign in with password
                    </span>
                </div>

                <form action="/login" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" autocomplete="username webauthn" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        Sign In <i class="bi bi-box-arrow-in-right ms-1"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
